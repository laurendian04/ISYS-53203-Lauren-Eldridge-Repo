<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Thing in Japanese Today</title><style>body{font:16px system-ui;background:#f7f1ec;color:#302d39;margin:0}main{max-width:680px;margin:40px auto;padding:28px;background:#fff;border-radius:20px;box-shadow:0 8px 30px #36231515}.tag{color:#8f3a63;font-weight:700;text-transform:uppercase;letter-spacing:.1em}#term{font-size:2.5rem;margin:12px 0}#romaji{font-size:1.1rem;color:#675264;margin-bottom:3px}#soundout{font-size:1.1rem;font-weight:650;margin:4px 0 14px}#audioStatus{min-height:1.4em;color:#675264}section{background:#faf2f4;border-radius:12px;padding:18px;margin:20px 0}button{background:#9b3d69;color:white;border:0;padding:12px 17px;border-radius:9px;font:inherit;cursor:pointer;margin:4px 6px 4px 0}.muted{color:#766f75}#quiz{min-height:26px}</style><main><p class="tag">A little Japanese each day</p><h1 id="term"></h1><p id="romaji"></p><p id="soundout"></p><button id="listen" type="button">🔊 Hear the Japanese</button><p id="audioStatus" role="status"></p><section><strong id="category"></strong><p id="meaning"></p><p id="context"></p></section><button id="reveal">Reveal example</button><button id="next">Explore another</button><p id="example" aria-live="polite"></p><p class="muted" id="date"></p><p class="muted">A curated introductory sample. One featured lesson changes at midnight on your device; “Explore another” previews more lessons. No account or network connection needed. Audio requires a Japanese voice on your device; English sound-out spellings are only approximations.</p></main><script>const lessons=[{cat:'Phrase',term:'おはようございます',soundout:'oh-HAH-yoh goh-ZAH-ee-mahs',romaji:'Ohayō gozaimasu',meaning:'Good morning (polite).',context:'Use it to greet a teacher, coworker, or someone you do not know well.',example:'おはようございます、田中さん。 / Good morning, Tanaka-san.'},{cat:'Culture',term:'いただきます',soundout:'ee-tah-dah-KEE-mahs',romaji:'Itadakimasu',meaning:'A phrase commonly said before eating.',context:'It expresses appreciation for the meal and what made it possible; it is not a literal equivalent of “bon appétit.”',example:'Before starting a meal together: いただきます。'},{cat:'Phrase',term:'ありがとうございます',soundout:'ah-ree-GAH-toh goh-ZAH-ee-mahs',romaji:'Arigatō gozaimasu',meaning:'Thank you (polite).',context:'A useful choice in shops and with people you have just met.',example:'助けてくれてありがとうございます。 / Thank you for helping me.'},{cat:'Culture',term:'おつかれさまです',soundout:'oht-soo-KAH-reh-sah-mah dess',romaji:'Otsukaresama desu',meaning:'A common workplace acknowledgment.',context:'Often used to greet colleagues or recognize their work; its meaning depends on context.',example:'At the end of a team meeting: おつかれさまです。'},{cat:'Phrase',term:'すみません',soundout:'soo-mee-MAH-sen',romaji:'Sumimasen',meaning:'Excuse me; sorry; sometimes thank you.',context:'Useful for getting attention politely, apologizing, or acknowledging an inconvenience.',example:'すみません、駅はどこですか。 / Excuse me, where is the station?'},{cat:'Culture',term:'靴を脱ぐ',soundout:'koo-tsoo oh noo-goo',romaji:'Kutsu o nugu',meaning:'To take off your shoes.',context:'Many homes have an entrance area called a genkan where outdoor shoes are removed.',example:'玄関で靴を脱ぎます。 / I take off my shoes at the entrance.'},{cat:'Phrase',term:'お願いします',soundout:'oh-neh-GAH-ee-shee-mahs',romaji:'Onegaishimasu',meaning:'Please; I would appreciate it.',context:'Used when making requests and in many introductions or cooperative activities.',example:'よろしくお願いします。 / I look forward to working with you.'},{cat:'Word',term:'木漏れ日',soundout:'koh-moh-reh-bee',romaji:'Komorebi',meaning:'Sunlight filtering through trees.',context:'A descriptive word you might see in writing or travel posts.',example:'公園の木漏れ日がきれいです。 / The sunlight through the trees in the park is beautiful.'},{cat:'Phrase',term:'大丈夫です',soundout:'dye-JOH-boo dess',romaji:'Daijōbu desu',meaning:'It is okay; I am fine.',context:'Depending on tone and situation, this can accept reassurance or politely decline an offer.',example:'お水はいりますか。大丈夫です。 / Would you like water? I am okay.'},{cat:'Culture',term:'花見',soundout:'hah-nah-mee',romaji:'Hanami',meaning:'Viewing flowers, especially cherry blossoms.',context:'People may gather outdoors during the spring blossom season.',example:'春に友達と花見をします。 / I go cherry blossom viewing with friends in spring.'},{cat:'Word',term:'猫',soundout:'neh-koh',romaji:'Neko',meaning:'Cat.',context:'An easy everyday noun. The particle が can mark the subject of a sentence.',example:'猫が好きです。 / I like cats.'},{cat:'Phrase',term:'またね',soundout:'mah-tah neh',romaji:'Mata ne',meaning:'See you later (casual).',context:'Use with friends; choose a more formal goodbye in professional situations.',example:'またね、明日！ / See you tomorrow!'}];const $=id=>document.getElementById(id);const d=new Date(),day=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);let index=((day%lessons.length)+lessons.length)%lessons.length;function show(){if('speechSynthesis' in window)window.speechSynthesis.cancel();const l=lessons[index];$('term').textContent=l.term;$('romaji').textContent='Romaji: '+l.romaji;$('soundout').textContent='Sound it out: '+l.soundout;$('audioStatus').textContent='';$('category').textContent=l.cat;$('meaning').textContent=l.meaning;$('context').textContent=l.context;$('example').textContent='';$('reveal').textContent='Reveal example';$('date').textContent=(index===((day%lessons.length)+lessons.length)%lessons.length?'Today’s featured lesson · ':'Extra lesson · ')+d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}$('listen').onclick=()=>{if(!('speechSynthesis' in window)){$('audioStatus').textContent='Audio is unavailable in this browser. Use the sound-out guide below the Japanese text.';return}const voices=window.speechSynthesis.getVoices(),voice=voices.find(v=>/^ja(-|_)/i.test(v.lang));if(!voice){$('audioStatus').textContent='No Japanese voice is installed on this device. The sound-out guide is still available.';return}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(lessons[index].term);utterance.lang='ja-JP';utterance.voice=voice;utterance.rate=.82;utterance.onerror=()=>{$('audioStatus').textContent='Audio could not play on this device.'};$('audioStatus').textContent='Playing with '+voice.name+'…';window.speechSynthesis.speak(utterance)};$('reveal').onclick=()=>{$('example').textContent=lessons[index].example;$('reveal').textContent='Example shown'};$('next').onclick=()=>{index=(index+1)%lessons.length;show()};show()</script></html>
